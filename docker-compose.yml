services:
  arista-eos-mcp:
    image: ${IMAGE_REPO:-harbor.sahibindenlocal.net/nwsec/arista/arista-eos-mcp}:${IMAGE_TAG:-1.2.1}
    container_name: arista-eos-mcp
    restart: unless-stopped
    user: "0:0"   # devices.json 600 izinli ve root'a ait; okuyabilmesi icin
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_ADDR: ":8080"
      EOS_CONFIG: /config/devices.json
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN .env icinde tanimli olmali}
    ports:
      - "${BIND_ADDR:-10.211.112.12}:8080:8080"
    volumes:
      - ./devices.json:/config/devices.json:ro
